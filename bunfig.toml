[test]
root = "./test"
coverage = true

coverageSkipTestFiles = true

coveragePathIgnorePatterns = [
  "lib/defaults/**",
  "test/utils/*.ts",
  "dist/**/*.js",
  "dist/**/*.ts",
  "../**/*.ts",
  "../**/*.js",
]


[test.reporter]
junit = "junit.xml"

[fmt]
printWidth = 120
singleQuote = true
ignorePatterns = [
  ".changeset/",
  ".claude/",
  ".cursor/",
  ".github/",
  "*.log",
  "*.md",
  "bun.lockb",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
]
